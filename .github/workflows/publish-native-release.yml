name: Publish tested simulator packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['release-input.json', '.github/workflows/publish-native-release.yml']

permissions:
  contents: write

concurrency:
  group: native-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Restore installer download cache
        id: installer-cache
        uses: actions/cache/restore@v6
        with:
          path: release-assets
          key: native-installers-${{ hashFiles('release-input.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-installers-${{ hashFiles('release-input.json') }}-
      - name: Download and verify the accepted installer
        run: |
          python3 - <<'PY'
          import hashlib,json,re,subprocess,math,shutil
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import urlparse
          data=json.loads(Path('release-input.json').read_text())
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',data['tag'])
          assert data['native_acceptance']['passed'] is True
          assert data['native_acceptance']['original_build_prefix_hidden'] is True
          assert data['native_acceptance']['autopilot_robots']==['bluerov2','wamv']
          assert data['native_acceptance']['local_ros_displacement_m']>=2
          proof=data['dmg_acceptance']
          assert proof['passed'] and proof['staged_signature_verified'] and proof['mounted_signature_verified']
          assert proof['mounted_diagnostic']['engine_mode']=='native-metal'
          assert proof['mounted_diagnostic']['native_engine_included'] is True
          assert proof['mounted_version']=='WWW-POSIM '+data['tag'][1:]
          assert proof['engine_sha256']==data['native_acceptance']['tested_archive_sha256']
          assert any(a['name']==proof['dmg'] and a['sha256']==proof['sha256'] for a in data['assets'])
          folder=Path('release-assets');folder.mkdir(exist_ok=True)
          def checksum(file):
            with file.open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
          def remove_parts(target):
            for file in folder.glob(target.name+'.part-*'):file.unlink()
          retry=['--retry','5','--retry-connrefused','--retry-all-errors',
            '--connect-timeout','20','--max-time','2700']
          for entry in data['assets']:
            assert re.fullmatch(r'[A-Za-z0-9_.-]+',entry['name'])
            url=urlparse(entry['url'])
            assert url.scheme=='https' and not url.username and not url.password
            assert url.hostname=='api.wschoi.com' and url.port==8008
            assert url.path.startswith('/guide/packages/') and not url.query
            assert re.fullmatch(r'[0-9a-f]{64}',entry['sha256'])
            target=folder/entry['name']
            if target.exists():
              if target.stat().st_size==entry['bytes'] and checksum(target)==entry['sha256']:
                remove_parts(target)
                print(f"Verified cached installer: {entry['name']}",flush=True)
                continue
              target.unlink()
            # Bounded ranges avoid one slow trans-Pacific TCP connection.
            count=min(12,max(1,math.ceil(entry['bytes']/(4*1024*1024))))
            if count==1:
              subprocess.run(['curl','--fail','--location','--silent','--show-error',
                *retry,
                '--max-filesize',str(entry['bytes']),'--output',str(target),entry['url']],check=True)
            else:
              span=math.ceil(entry['bytes']/count)
              def part(index):
                start=index*span;end=min(entry['bytes'],start+span)-1
                file=target.with_name(target.name+f'.part-{index}')
                digest=file.with_name(file.name+'.sha256')
                if file.exists() and digest.exists() and file.stat().st_size==end-start+1:
                  if checksum(file)==digest.read_text().strip():
                    print(f"Verified cached range {index+1}/{count}: {entry['name']}",flush=True)
                    return file
                result=subprocess.run(['curl','--fail','--location','--silent','--show-error',
                  *retry,
                  '--range',f'{start}-{end}','--max-filesize',str(end-start+1),
                  '--write-out','%{http_code}','--output',str(file),entry['url']],
                  check=True,capture_output=True,text=True)
                assert result.stdout=='206' and file.stat().st_size==end-start+1
                digest.write_text(checksum(file))
                print(f"Verified range {index+1}/{count}: {entry['name']}",flush=True)
                return file
              with ThreadPoolExecutor(max_workers=count) as pool:parts=list(pool.map(part,range(count)))
              with target.open('wb') as output:
                for file in parts:
                  with file.open('rb') as source:shutil.copyfileobj(source,output)
            assert target.stat().st_size==entry['bytes'], 'Incorrect byte count: '+entry['name']
            if checksum(target)!=entry['sha256']:
              target.unlink();remove_parts(target)
              raise AssertionError('Incorrect checksum: '+entry['name'])
            remove_parts(target)
            print(f"Verified complete installer: {entry['name']}",flush=True)
          Path('release-tag.txt').write_text(data['tag'])
          print('All public installer assets match the tested release checksums')
          PY
      - name: Save verified downloads and resumable ranges
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: release-assets
          key: ${{ steps.installer-cache.outputs.cache-primary-key }}
      - name: Publish public binary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(cat release-tag.txt)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --target main --title "WWW-POSIM ${tag#v} · Simulator packages" \
              --notes-file RELEASE.md
          fi
          if [ "$tag" = "v0.3.1" ] && gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.3.0 --repo "$GITHUB_REPOSITORY" --notes-file RETIRED-0.3.0.md
          fi
      - name: Update Homebrew only after the verified release is available
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          data=json.loads(Path('release-input.json').read_text())
          name=data['dmg_acceptance']['dmg']
          file=next(a for a in data['assets'] if a['name']==name)
          version=data['tag'][1:]
          url=f"https://github.com/IOES-Lab/homebrew-www-posim/releases/download/{data['tag']}/{name}"
          cask=['cask "www-posim" do',f'  version "{version}"',f'  sha256 "{file["sha256"]}"',
            f'  url "{url}"','  name "WWW-POSIM"',
            '  desc "Ocean robot simulator with native ROS, Gazebo and Metal rendering"',
            '  homepage "https://lab.wschoi.com"','  depends_on arch: :arm64',
            '  depends_on macos: :golden_gate','  app "WWW-POSIM.app"','end']
          Path('Casks/www-posim.rb').write_text('\n'.join(cask)+'\n')
          PYCODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/www-posim.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Homebrew to verified $(cat release-tag.txt)"
            git push origin HEAD:main
          fi
