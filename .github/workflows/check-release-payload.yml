name: Check native payload publication

on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/check-release-payload.yml', '.github/workflows/publish-native-release.yml']

permissions:
  contents: read

jobs:
  payload-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts
